name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Installed-app OAuth client IDs are public identifiers, not secrets.
          GPFC_GOOGLE_CLIENT_ID: 43154637059-a8t1kbv88cv9kj51edigsluh0gkbvn2m.apps.googleusercontent.com
          GPFC_GOOGLE_WEB_CLIENT_ID: 43154637059-t2no9fsmb7rmn2pnd1d6p6dlvroga1q0.apps.googleusercontent.com

      - name: Verify dist
        run: npm run verify:dist
